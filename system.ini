; ===== SCREENPACK TEMPLATE =====
; Copy this folder, rename it (no leading underscore), edit what you like.
; Every key is optional: anything you leave out uses the built-in default.
; Colors are hex RRGGBB. Comments must be on their own line (; or #).
; Switch packs in OPTIONS > SCREENPACK. SELECT on the title screen reloads.

[info]
name=My Pack

[general]
; animated speed lines over the background (1/0)
streaks=1

[colors]
accent=FFE000
text=FFFFFF
dim=909090
bg_top=101030
bg_bottom=203060

[title]
; optional 8-bit PNG (max 480x272 shown). Needs the PNG loader.
bg=
logo_line1=MY
logo_line2=GAME
logo_y=28
logo_scale=5
menu_y=140
menu_spacing=24
menu_scale=2
; item=LABEL,action   actions: versus, training, options, exit
; if you list any item=, the built-in menu is replaced
item=VERSUS CPU,versus
item=TRAINING,training
item=OPTIONS,options
item=EXIT,exit

[select]
bg=
cols=6
rows=2
cell_w=64
cell_h=52
gap=8
grid_y=40
show_info=1
title_p1=SELECT YOUR FIGHTER
title_p2=SELECT OPPONENT

[stage]
title=SELECT STAGE

[hud]
bar_w=200
bar_h=12
bar_y=14
margin=12
timer_y=10
timer_scale=2
pips=1
life_color=30FFA0
trail_color=FF6020
round_text=ROUND
fight_text=FIGHT!
ko_text=K.O.
time_text=TIME UP

[results]
bg=
win_text=WINS!

[options]
bg=
