; Copy this folder, rename it (no leading underscore), edit the values.
; Everything except char.ini is optional. No sprites.png => colored box.
[character]
version=1
name=Template
sprite=sprites.png
frame_w=96
frame_h=96
pivot_x=48
pivot_y=96
hp=1000
walk_speed=2.5
jump_vel=-9
color=FFFFFF

; anim sections must come BEFORE the moves that use them
[anim:idle]
frames=0,1,2,3,2,1
speed=6
loop=1

[anim:light]
frames=8,9,10
speed=3
loop=0

[move:light]
input=SQUARE
anim=light
startup=4
active=3
recovery=8
damage=40
hitstun=14
blockstun=9
pushback=5
hitstop=6
hitbox=16,-60,34,16
